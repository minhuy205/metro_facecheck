<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký - Metro FaceCheck</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <style>
    /* Nút lựa chọn role */
    .role-options {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .role-option {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s;
      font-weight: 500;
    }

    .role-option.selected {
      background-color: rgba(255, 255, 255, 0.3);
      border-color: #ff4081;
    }

    .role-option input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-overlay"></div>
    <div class="auth-card">
      <div class="auth-header">
        <h2>Đăng Ký Tài Khoản</h2>
        <p>Tạo tài khoản Metro FaceCheck để sử dụng dịch vụ</p>
      </div>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST" class="auth-form">
        <div class="form-group">
          <label>Bạn là:</label>
          <div class="role-options">
            <label class="role-option selected">
              <input type="radio" name="role" value="user" checked>
              Người Dùng
            </label>
            <!-- <label class="role-option">
              <input type="radio" name="role" value="admin">
              Quản Trị Viên
            </label> -->
          </div>
        </div>

        <div class="form-group">
          <label for="username">Tên Đăng Nhập</label>
          <input type="text" id="username" name="username" placeholder="Chọn tên đăng nhập" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Nhập email" required>
        </div>

        <div class="form-group">
          <label for="phone">Số Điện Thoại</label>
          <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
        </div>

        <div class="form-group">
          <label for="password">Mật Khẩu</label>
          <input type="password" id="password" name="password" placeholder="Mật khẩu tối thiểu 6 ký tự" required>
        </div>

        <div class="form-group">
          <label for="password_confirm">Xác Nhận Mật Khẩu</label>
          <input type="password" id="password_confirm" name="password_confirm" placeholder="Nhập lại mật khẩu" required>
        </div>

        <button type="submit" class="btn-login">Đăng Ký</button>
      </form>

      <div class="auth-footer">
        <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
      </div>

      <div class="back-home">
        <a href="/" class="back-button">← Quay về trang chủ</a>
      </div>
    </div>
  </div>

  <script>
    // JS để toggle class selected
    const roleOptions = document.querySelectorAll('.role-option');

    roleOptions.forEach(option => {
      option.addEventListener('click', () => {
        roleOptions.forEach(o => o.classList.remove('selected'));
        option.classList.add('selected');
        option.querySelector('input').checked = true;
      });
    });
  </script>
</body>
</html>
